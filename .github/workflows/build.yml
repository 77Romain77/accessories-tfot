name: Build Forge mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Accessories Forge 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Forge mod
        run: ./gradlew :neoforge:build -PforgeBuildOnly -Penabled_platforms=forge --no-daemon --stacktrace

      - name: Upload Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: accessories-forge-1.20.1-${{ github.sha }}
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev-shadow.jar
          if-no-files-found: error
